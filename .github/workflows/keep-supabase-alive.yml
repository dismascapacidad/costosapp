name: Keep Supabase Alive

on:
  schedule:
    # Runs every 4 days at 08:00 UTC (Supabase pauses after 7 days of inactivity)
    - cron: '0 8 */4 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          response=$(curl -s -L -o /dev/null -w "%{http_code}" \
            "https://bvlztojamfzbplqudvim.supabase.co/auth/v1/health")
          echo "Response code: $response"
          # Any HTTP response means the project is active (even 401/403)
          # Only fail if curl returns 000 (no connection)
          if [ "$response" = "000" ]; then
            echo "No response - project may be down"
            exit 1
          else
            echo "Supabase is alive (response: $response)"
          fi
