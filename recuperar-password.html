<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva contraseña – CostosApp</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <div class="login-logo">
      <h1>CostosApp</h1>
      <span>gestión de producción</span>
    </div>

    <!-- Estado: verificando token -->
    <div id="estado-verificando">
      <p style="text-align:center; color:var(--text-2); font-size:0.9rem;">Verificando enlace...</p>
    </div>

    <!-- Formulario de nueva contraseña -->
    <div id="form-nueva-password" class="oculto">
      <p style="color:var(--text-2); font-size:0.875rem; margin-bottom:1.25rem;">
        Elegí una nueva contraseña para tu cuenta.
      </p>
      <div class="form-group">
        <label for="nueva-password">Nueva contraseña</label>
        <input type="password" id="nueva-password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label for="nueva-password2">Repetir contraseña</label>
        <input type="password" id="nueva-password2" placeholder="Repetí la contraseña" autocomplete="new-password" />
      </div>
      <button class="btn btn-primary login-btn" id="btn-cambiar" onclick="cambiarPassword()">
        Guardar nueva contraseña
      </button>
    </div>

    <!-- Enlace inválido o expirado -->
    <div id="estado-invalido" class="oculto">
      <p style="text-align:center; color:var(--text-2); font-size:0.9rem; margin-bottom:1rem;">
        El enlace de recuperación no es válido o expiró.
      </p>
      <a href="login.html" class="btn btn-primary login-btn" style="display:block; text-align:center; text-decoration:none;">
        Volver al inicio de sesión
      </a>
    </div>

    <!-- Mensajes de error / éxito -->
    <div id="login-mensaje" class="login-mensaje oculto"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>

<script>
// ── Inicializar ──────────────────────────────────────────────────────────────

var _sesionRecuperacion = false;

(function init() {
  var sb = getSupabase();
  if (!sb) {
    mostrarInvalido();
    return;
  }

  // Supabase v2 procesa automáticamente el hash de la URL.
  // Escuchamos el evento PASSWORD_RECOVERY para saber que el token es válido.
  sb.auth.onAuthStateChange(function(event, session) {
    if (event === 'PASSWORD_RECOVERY') {
      _sesionRecuperacion = true;
      mostrarFormulario();
    } else if (event === 'SIGNED_IN' && _sesionRecuperacion) {
      // Después de updateUser, Supabase emite SIGNED_IN — ignorarlo aquí.
    }
  });

  // Tiempo de espera: si en 3 s no llega PASSWORD_RECOVERY, el token no estaba.
  setTimeout(function() {
    if (!_sesionRecuperacion) {
      mostrarInvalido();
    }
  }, 3000);
})();

// ── Cambiar contraseña ───────────────────────────────────────────────────────

async function cambiarPassword() {
  var password  = document.getElementById('nueva-password').value;
  var password2 = document.getElementById('nueva-password2').value;
  var btn       = document.getElementById('btn-cambiar');

  if (!password) {
    mostrarMensaje('Ingresá una contraseña.', 'error');
    return;
  }
  if (password.length < 6) {
    mostrarMensaje('La contraseña debe tener al menos 6 caracteres.', 'error');
    return;
  }
  if (password !== password2) {
    mostrarMensaje('Las contraseñas no coinciden.', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Guardando...';

  var sb = getSupabase();
  var result = await sb.auth.updateUser({ password: password });

  if (result.error) {
    mostrarMensaje('Error: ' + result.error.message, 'error');
    btn.disabled = false;
    btn.textContent = 'Guardar nueva contraseña';
    return;
  }

  mostrarMensaje('¡Contraseña actualizada! Redirigiendo...', 'exito');

  setTimeout(function() {
    window.location.href = 'index.html';
  }, 1800);
}

// ── UI helpers ───────────────────────────────────────────────────────────────

function mostrarFormulario() {
  document.getElementById('estado-verificando').classList.add('oculto');
  document.getElementById('estado-invalido').classList.add('oculto');
  document.getElementById('form-nueva-password').classList.remove('oculto');
}

function mostrarInvalido() {
  document.getElementById('estado-verificando').classList.add('oculto');
  document.getElementById('form-nueva-password').classList.add('oculto');
  document.getElementById('estado-invalido').classList.remove('oculto');
}

function mostrarMensaje(texto, tipo) {
  var el = document.getElementById('login-mensaje');
  el.textContent = texto;
  el.className = 'login-mensaje ' + tipo;
  el.classList.remove('oculto');
}

// Enter para enviar
document.addEventListener('keydown', function(e) {
  if (e.key !== 'Enter') return;
  if (!document.getElementById('form-nueva-password').classList.contains('oculto')) {
    cambiarPassword();
  }
});
</script>

</body>
</html>
